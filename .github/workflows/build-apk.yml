name: Build APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.x

      - name: Create .env
        run: echo "API_BASE_URL=https://novamymentor.cloud/api" > .env

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-android-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        run: |
          gh release create "v1.0.0-build-${{ github.run_number }}" \
            --title "Build #${{ github.run_number }}" \
            --notes "Auto-built from main." \
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GH_TOKEN: ${{ github.token }}
