name: nova_android
description: Nova - AI-powered educational platform for students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  flutter_secure_storage: ^9.0.0
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  shimmer: ^3.0.0
  flutter_local_notifications: ^17.0.0
  webview_flutter: ^4.5.0
  share_plus: ^9.0.0
  path_provider: ^2.1.0
  intl: ^0.19.0
  dotted_border: ^2.1.0
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  flutter_dotenv: ^5.2.1
  flutter_markdown: ^0.7.4
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
